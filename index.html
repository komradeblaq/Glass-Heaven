<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Heaven</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial;background:#0b0b0b;color:#fff}

/* HEADER */
header{padding:20px;position:sticky;top:0;background:#111;border-bottom:1px solid #333}
nav{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}
.logo{font-size:26px;color:#d4af37;font-weight:bold}
.logo img{height:40px;vertical-align:middle;margin-right:8px}

/* BUTTON */
.btn{background:#d4af37;color:#000;padding:10px 16px;border-radius:20px;text-decoration:none;font-weight:bold;cursor:pointer;border:none}

/* HERO */
.hero{padding:80px 20px;text-align:center;background:linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.8)),url('images/image_1') center/cover}
.hero h1{font-size:42px;color:#d4af37}
.hero p{margin:10px auto;max-width:600px}

/* GRID */
.section{padding:50px 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}

.card{background:#151515;border-radius:15px;overflow:hidden;border:1px solid #333}
.card img,.card video{width:100%;height:220px;object-fit:cover}
.card h3{padding:10px;color:#d4af37}
.card p{padding:0 10px 10px;color:#ccc}

/* CART MODAL */
.cart-modal{
display:none;
position:fixed;
top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,.8);
z-index:9999;
}
.cart-box{
background:#111;
width:90%;
max-width:500px;
margin:50px auto;
padding:20px;
border-radius:15px;
border:1px solid #d4af37;
}
.close{float:right;color:red;cursor:pointer}

/* FLOAT HELP */
.help{
position:fixed;
bottom:20px;
left:20px;
background:#25D366;
color:#fff;
padding:12px;
border-radius:50px;
text-decoration:none;
font-weight:bold;
}
</style>
</head>

<body>

<header>
<nav>
<div class="logo">
<img src="images/logo.png"> Glass Heaven
</div>

<div>
<button class="btn" onclick="openCart()">Cart 🛒 (<span id="count">0</span>)</button>
<a class="btn" href="#glasses">Shop</a>
</div>
</nav>
</header>

<!-- HERO -->
<section class="hero">
<h1>Glass Heaven</h1>
<p>Luxury Glasses & Fashion Masks Store</p>
<a class="btn" href="https://www.instagram.com/glasseshaven_1?igsh=ZTBwemdubDY5YTZs">Instagram</a>
</section>

<!-- PRODUCTS -->
<section class="section" id="glasses">
<h2 style="color:#d4af37">Glass Collection</h2>

<div class="grid">

<div class="card">
<img src="images/image_1">
<h3>Premium Glass</h3>
<button class="btn" onclick="add('Premium Glass')">Add to Cart</button>
</div>

<div class="card">
<img src="images/image_2">
<h3>Luxury Frame</h3>
<button class="btn" onclick="add('Luxury Frame')">Add to Cart</button>
</div>

</div>
</section>

<!-- MASKS -->
<section class="section">
<h2 style="color:#d4af37">Masks</h2>

<div class="grid">

<div class="card">
<img src="images/image_10">
<h3>Fashion Mask</h3>
<button class="btn" onclick="add('Fashion Mask')">Add to Cart</button>
</div>

</div>
</section>

<!-- VIDEOS -->
<section class="section">
<h2 style="color:#d4af37">Videos</h2>

<div class="grid">
<div class="card">
<video controls src="videos/video_1"></video>
<h3>Showcase</h3>
</div>
</div>
</section>

<!-- CART MODAL -->
<div class="cart-modal" id="cartModal">
<div class="cart-box">

<span class="close" onclick="closeCart()">X</span>

<h2 style="color:#d4af37">Your Cart</h2>

<ul id="cartList"></ul>

<br>

<button class="btn" onclick="checkout()">Proceed to Order</button>

</div>
</div>

<!-- CHECKOUT FORM -->
<div class="cart-modal" id="formModal">
<div class="cart-box">

<h2 style="color:#d4af37">Checkout Form</h2>

<input id="name" placeholder="Your Name" style="width:100%;padding:10px;margin:5px">
<input id="phone" placeholder="Phone Number" style="width:100%;padding:10px;margin:5px">
<input id="location" placeholder="Location / State / Country" style="width:100%;padding:10px;margin:5px">
<select id="gender" style="width:100%;padding:10px;margin:5px">
<option>Male</option>
<option>Female</option>
</select>

<br><br>

<button class="btn" onclick="sendWhatsApp()">Submit Order</button>

</div>
</div>

<!-- HELP -->
<a class="help" href="https://wa.me/2348126773553">Need Help?</a>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function save(){
localStorage.setItem("cart",JSON.stringify(cart));
}

function update(){
document.getElementById("count").innerText = cart.length;
let list = document.getElementById("cartList");
list.innerHTML = "";
cart.forEach((item,i)=>{
list.innerHTML += `<li>${item} <button onclick="removeItem(${i})">Remove</button></li>`;
});
save();
}

function add(item){
cart.push(item);
update();
}

function removeItem(i){
cart.splice(i,1);
update();
}

function openCart(){
document.getElementById("cartModal").style.display="block";
update();
}

function closeCart(){
document.getElementById("cartModal").style.display="none";
}

function checkout(){
document.getElementById("cartModal").style.display="none";
document.getElementById("formModal").style.display="block";
}

function sendWhatsApp(){
let name=document.getElementById("name").value;
let phone=document.getElementById("phone").value;
let location=document.getElementById("location").value;
let gender=document.getElementById("gender").value;

let message =
`Hello Glass Heaven Order:%0A
Name: ${name}%0A
Phone: ${phone}%0A
Location: ${location}%0A
Gender: ${gender}%0A
Items:%0A${cart.join("%0A")}`;

window.open(`https://wa.me/2348126773553?text=${message}`,"_blank");
}

update();
</script>

</body>
</html>
