<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Heaven</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial;background:#0b0b0b;color:#fff}

/* HEADER */
header{padding:20px;position:sticky;top:0;background:#111;border-bottom:1px solid #333}
nav{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}
.logo{font-size:26px;color:#d4af37;font-weight:bold;display:flex;align-items:center;gap:10px}
.logo img{height:40px}

/* BUTTON */
.btn{background:#d4af37;color:#000;padding:10px 15px;border-radius:20px;text-decoration:none;font-weight:bold;border:none;cursor:pointer;margin:5px}

/* HERO */
.hero{padding:80px 20px;text-align:center;background:linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.8)),url('images/image_1.jpg') center/cover}
.hero h1{font-size:42px;color:#d4af37}

/* GRID */
.section{padding:50px 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.card{background:#151515;border-radius:15px;overflow:hidden;border:1px solid #333}
.card img,.card video{width:100%;height:220px;object-fit:cover}
.card h3{padding:10px;color:#d4af37}

/* CART */
.cart-modal,.form-modal{
display:none;position:fixed;top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,.85);z-index:9999;
}

.box{
background:#111;width:90%;max-width:500px;
margin:50px auto;padding:20px;border-radius:15px;
border:1px solid #d4af37;
}

.close{float:right;color:red;cursor:pointer}

/* REMOVE BUTTON */
.remove-btn{
background:red;color:#fff;border:none;
padding:5px 10px;border-radius:8px;
cursor:pointer;margin-left:10px;
}
</style>
</head>

<body>

<header>
<nav>

<div class="logo">
<img src="images/logo.png" onerror="this.style.display='none'">
Glass Heaven
</div>

<div>
<button class="btn" onclick="openCart()">Cart 🛒 (<span id="count">0</span>)</button>
</div>

</nav>
</header>

<!-- HERO -->
<section class="hero">
<h1>Glass Heaven</h1>
<p>Luxury Glasses & Fashion Masks Store</p>
</section>

<!-- GLASSES (UNCHANGED) -->
<section class="section">
<h2 style="color:#d4af37">Glass Collection</h2>

<div class="grid">

<!-- YOUR 18 IMAGES KEPT AS IS -->
<div class="card">
<img src="images/image_1.jpg">
<h3>Glass 1</h3>
<button class="btn" onclick="add('Glass 1')">Add to Cart</button>
<a class="btn" href="https://wa.me/2348126773553">Order Now</a>
</div>

<div class="card">
<img src="images/image_2.jpg">
<h3>Glass 2</h3>
<button class="btn" onclick="add('Glass 2')">Add to Cart</button>
<a class="btn" href="https://wa.me/2348126773553">Order Now</a>
</div>

<!-- REST OF YOUR 3–18 STAYS EXACTLY SAME -->

</div>
</section>

<!-- VIDEOS (UPDATED ONLY) -->
<section class="section">
<h2 style="color:#d4af37">Videos</h2>

<div class="grid">

<div class="card">
<video src="videos/video_1.mp4" controls></video>
<h3>Video 1</h3>
<button class="btn" onclick="add('Video 1')">Add to Cart</button>
<a class="btn" href="https://wa.me/2348126773553">Order Now</a>
</div>

<div class="card">
<video src="videos/video_2.mp4" controls></video>
<h3>Video 2</h3>
<button class="btn" onclick="add('Video 2')">Add to Cart</button>
<a class="btn" href="https://wa.me/2348126773553">Order Now</a>
</div>

<!-- KEEP VIDEO 3–10 SAME -->

</div>
</section>

<!-- CART -->
<div class="cart-modal" id="cartModal">
<div class="box">

<span class="close" onclick="closeCart()">X</span>

<h2 style="color:#d4af37">Your Cart</h2>

<ul id="list"></ul>

<br>
<button class="btn" onclick="checkout()">Proceed to Order</button>

</div>
</div>

<!-- FORM (ADDRESS FIXED + BACK BUTTON ADDED) -->
<div class="form-modal" id="formModal">
<div class="box">

<h2 style="color:#d4af37">Checkout Form</h2>

<input id="name" placeholder="Name" style="width:100%;padding:10px;margin:5px">
<input id="phone" placeholder="Phone" style="width:100%;padding:10px;margin:5px">
<input id="address" placeholder="Address" style="width:100%;padding:10px;margin:5px">

<select id="gender" style="width:100%;padding:10px;margin:5px">
<option>Male</option>
<option>Female</option>
</select>

<br><br>

<button class="btn" onclick="goBack()">⬅ Back</button>
<button class="btn" onclick="send()">Submit to WhatsApp</button>

</div>
</div>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

function save(){
localStorage.setItem("cart",JSON.stringify(cart));
}

function update(){
document.getElementById("count").innerText = cart.length;

let list = document.getElementById("list");
list.innerHTML="";

cart.forEach((item,i)=>{
list.innerHTML += `
<li>
${item}
<button class="remove-btn" onclick="removeItem(${i})">Remove</button>
</li>`;
});

save();
}

function add(item){
cart.push(item);
update();
}

function removeItem(i){
cart.splice(i,1);
update();
}

function openCart(){
document.getElementById("cartModal").style.display="block";
update();
}

function closeCart(){
document.getElementById("cartModal").style.display="none";
}

function checkout(){
document.getElementById("cartModal").style.display="none";
document.getElementById("formModal").style.display="block";
}

function goBack(){
document.getElementById("formModal").style.display="none";
document.getElementById("cartModal").style.display="block";
}

function send(){

let msg = `
Glass Heaven Order

Name: ${name.value}
Phone: ${phone.value}
Address: ${address.value}
Gender: ${gender.value}

Items:
${cart.join(", ")}
`;

window.open("https://wa.me/2348126773553?text="+encodeURIComponent(msg));
}

update();

</script>

</body>
</html>
